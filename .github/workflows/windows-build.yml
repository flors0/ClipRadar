name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Install and bundle media tools
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          New-Item -ItemType Directory -Force -Path vendor\bin | Out-Null
          $toolRoot = Join-Path $env:ChocolateyInstall "lib\ffmpeg\tools"
          $ffmpeg = (Get-ChildItem $toolRoot -Filter ffmpeg.exe -Recurse | Select-Object -First 1).FullName
          $ffprobe = (Get-ChildItem $toolRoot -Filter ffprobe.exe -Recurse | Select-Object -First 1).FullName
          if (-not $ffmpeg -or -not $ffprobe) { throw "Chocolatey installed FFmpeg but its binaries were not found." }
          Copy-Item $ffmpeg vendor\bin\ffmpeg.exe
          Copy-Item $ffprobe vendor\bin\ffprobe.exe

      - name: Run real core and UI tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Capture UI preview
        shell: pwsh
        run: python scripts\capture_ui.py ui-preview.png

      - name: Build Windows application
        shell: pwsh
        run: |
          python scripts\generate_icon.py
          python -m PyInstaller --noconfirm --clean clipradar.spec

      - name: Test packaged EXE
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\ClipRadar\ClipRadar.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged EXE self-test failed with code $($process.ExitCode)" }

      - name: Package and verify application
        shell: pwsh
        run: |
          Compress-Archive -Path .\dist\ClipRadar\* -DestinationPath .\ClipRadar-Windows-x64.zip -CompressionLevel Optimal
          $extractRoot = Join-Path $env:RUNNER_TEMP "ClipRadar-archive-check"
          if (Test-Path $extractRoot) { Remove-Item $extractRoot -Recurse -Force }
          Expand-Archive -Path .\ClipRadar-Windows-x64.zip -DestinationPath $extractRoot -Force
          foreach ($required in @("ClipRadar.exe", "_internal\bin\ffmpeg.exe", "_internal\bin\ffprobe.exe")) {
            $requiredPath = Join-Path $extractRoot $required
            if (-not (Test-Path $requiredPath -PathType Leaf)) { throw "Extracted archive is missing $required" }
          }
          $process = Start-Process -FilePath (Join-Path $extractRoot "ClipRadar.exe") -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "EXE extracted by Windows failed self-test with code $($process.ExitCode)" }

      - name: Upload directly extractable Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipRadar-Windows-x64-v0.3.2
          path: dist/ClipRadar/
          if-no-files-found: error
          retention-days: 30

      - name: Upload UI preview
        uses: actions/upload-artifact@v4
        with:
          name: ClipRadar-UI-preview
          path: ui-preview*.png
          if-no-files-found: error
          retention-days: 30
